# ============================================
# 日志审计系统 — Docker Compose 编排
# ============================================
# 一条命令启动所有服务:
#   docker compose up -d
#
# 停止:
#   docker compose down
#
# 停止并删除数据卷（重置数据库）:
#   docker compose down -v
# ============================================

services:

  # ─── MySQL 8.0 ───────────────────────────
  mysql:
    image: mysql:8.0
    container_name: audit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: log_audit
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./01-log-audit-system/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./03-log-ai-assistant/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/02-ai-schema.sql
      - ./01-log-audit-system/src/main/resources/sql/seed-data.sql:/docker-entrypoint-initdb.d/03-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - audit-net

  # ─── Redis 7 ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: audit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - audit-net

  # ─── 项目一：日志审计查询系统 ────────────
  log-audit:
    build:
      context: ./01-log-audit-system
      dockerfile: Dockerfile
    container_name: audit-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/log_audit?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audit-net

  # ─── 项目三：日志智能分析助手 ────────────
  log-ai:
    build:
      context: ./03-log-ai-assistant
      dockerfile: Dockerfile
    container_name: audit-ai
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/log_audit?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      AI_API_KEY: ${AI_API_KEY}
      AI_API_URL: ${AI_API_URL:-https://api.anthropic.com/v1/messages}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - audit-net

  # ─── 项目二：日志解析与异常检测（CLI） ────
  # 命令行工具，不随 docker compose up 启动。
  # 按需运行：
  #   docker compose --profile tools run --rm log-parser -i sample_logs/access.csv -o /app/output --excel
  #   docker compose --profile tools run --rm log-parser -i sample_logs/server.log -o /app/output --excel
  log-parser:
    build:
      context: ./02-log-parser
      dockerfile: Dockerfile
    container_name: log-parser
    profiles:
      - tools
    networks:
      - audit-net

  # ─── Kafka (KRaft 分布式流式摄取与削峰集群) ───
  kafka:
    image: bitnami/kafka:3.7
    container_name: audit-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    profiles:
      - enterprise
    networks:
      - audit-net

  # ─── ClickHouse (OLAP 高性能列式 MergeTree 分析引擎) ───
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: audit-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    profiles:
      - enterprise
    networks:
      - audit-net

  # ─── Ollama (本地私有化大模型与数据离线安全推理) ───
  ollama:
    image: ollama/ollama:latest
    container_name: audit-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    profiles:
      - enterprise
    networks:
      - audit-net

volumes:
  mysql_data:
    name: audit_mysql_data
  redis_data:
    name: audit_redis_data
  clickhouse_data:
    name: audit_clickhouse_data
  ollama_models:
    name: audit_ollama_models

networks:
  audit-net:
    name: audit_network
    driver: bridge
