<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>登录 — AuditVault</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 登录页专属样式 */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%; max-width: 380px;
      background: var(--ink-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
    }
    .login-title {
      font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600;
      color: var(--text-primary); margin-bottom: 4px;
    }
    .login-sub {
      font-size: 0.78rem; color: var(--text-tertiary); margin-bottom: 28px;
    }
    .login-field { margin-bottom: 18px; }
    .login-field label {
      display: block; font-family: var(--font-mono); font-size: 0.68rem;
      color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 6px;
    }
    .login-field input {
      width: 100%; padding: 10px 13px;
      background: var(--ink-deep); border: 1px solid var(--border-std);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-family: var(--font-mono); font-size: 0.85rem; outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .login-field input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(103,155,201,0.1);
    }
    .login-btn {
      width: 100%; padding: 11px; margin-top: 6px;
      background: var(--accent-blue); color: #fff; border: none;
      border-radius: var(--radius-sm); font-family: var(--font-mono);
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: background var(--transition-fast);
      letter-spacing: 0.3px;
    }
    .login-btn:hover { background: #5790be; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error {
      display: none; margin-top: 16px; padding: 11px 14px;
      background: var(--red-dim); color: var(--accent-red);
      border-left: 2px solid var(--accent-red);
      border-radius: var(--radius-sm); font-size: 0.8rem;
    }
    .login-hint {
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-subtle);
      font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-tertiary);
      line-height: 1.8;
    }
    .login-hint code { color: var(--accent-amber); }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-title">AuditVault 登录</div>
    <div class="login-sub">日志审计系统 — 请使用账号登录</div>

    <form id="loginForm">
      <div class="login-field">
        <label>用户名</label>
        <input type="text" id="username" autocomplete="username" placeholder="admin" autofocus>
      </div>
      <div class="login-field">
        <label>密码</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
    </form>

    <div class="login-error" id="loginError"></div>

    <div class="login-hint">
      演示账号：<br>
      · <code>admin</code> / <code>admin123</code>（管理员，可导入导出）<br>
      · <code>user</code> / <code>user123</code>（普通用户，仅查询）
    </div>
  </div>
</div>

<script src="login.js?v=20260825"></script>
</body>

</html>
