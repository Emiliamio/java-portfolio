name: CI/CD Multi-Matrix Automated Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── 1. AuditVault (Spring Boot 3 + MySQL + Redis + ClickHouse) ──
  auditvault-test:
    name: AuditVault (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '17', '21' ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Run AuditVault 59 Unit & Integration Tests
        working-directory: 01-log-audit-system
        run: mvn clean test --batch-mode

  # ── 2. LogScope (Python 3.11/3.12 + FSM + mmap + Parquet) ──
  logscope-test:
    name: LogScope (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12' ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        working-directory: 02-log-parser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyarrow

      - name: Run LogScope 55 Pytest Test Suite
        working-directory: 02-log-parser
        run: python -m pytest -v

  # ── 3. Nexus AI (Spring Boot 3 + Semantic Cache + Sigma AST) ──
  nexus-ai-test:
    name: Nexus AI (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '17', '21' ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Run Nexus AI 21 Unit Tests
        working-directory: 03-log-ai-assistant
        run: mvn clean test --batch-mode

  # ── 4. Sample Order Service (Microservice 10s Ingestion Demo) ──
  sample-order-service-test:
    name: Sample Order Service (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Sample Service 3 Unit Tests
        working-directory: 04-sample-order-service
        run: mvn clean test --batch-mode
