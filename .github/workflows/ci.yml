name: CI/CD Multi-Matrix Automated Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── 1. AuditVault (Spring Boot 3 + MySQL + Redis + ClickHouse) ──
  auditvault-test:
    name: AuditVault (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '17', '21' ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Run AuditVault test suite
        working-directory: 01-log-audit-system
        run: mvn clean test --batch-mode

  # ── 2. LogScope (Python 3.11/3.12 + FSM + mmap + Parquet + DuckDB) ──
  logscope-test:
    name: LogScope (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12' ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        working-directory: 02-log-parser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyarrow duckdb

      - name: Run LogScope test suite
        working-directory: 02-log-parser
        run: python -m pytest -v

  # ── 3. Nexus AI Security Copilot (JDK 17 & JDK 21) ──
  nexus-ai-test:
    name: Nexus AI (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '17', '21' ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Run Nexus AI test suite
        working-directory: 03-log-ai-assistant
        run: mvn clean test --batch-mode

  # ── 4. Sample Order Microservice (JDK 17) ──
  sample-order-test:
    name: Sample Order Service (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Sample Service test suite
        working-directory: 04-sample-order-service
        run: mvn clean test --batch-mode

  # ── 5. TypeScript SDK Test (Node.js 20 LTS) ──
  typescript-sdk-test:
    name: TypeScript Client SDK (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run TypeScript SDK Tests
        working-directory: sdk/typescript
        run: npm test

  # ── 6. Security SAST & Dependency Vulnerability Gate ──
  security-audit:
    name: Security SAST & CVE Audit Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 扫描对象改为「构建产物镜像」而非源码 pom：
      # trivy fs 会为解析传递依赖去爬 Maven Central，共享 runner IP 极易被 429 反爬封禁；
      # 镜像内的 jar 自带 pom.properties，trivy 直接读取，不再依赖外网，且扫的是真实运行产物。
      - name: Build runnable jars and images
        run: |
          (cd 01-log-audit-system && mvn -B package -DskipTests -q)
          (cd 03-log-ai-assistant && mvn -B package -DskipTests -q)
          docker compose build

      - name: Install trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Scan AuditVault image (fails on CRITICAL/HIGH)
        run: trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 java-portfolio-log-audit:latest

      - name: Scan Nexus AI image (fails on CRITICAL/HIGH)
        run: trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 java-portfolio-log-ai:latest

      - name: Fail if committed secrets detected
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --verbose --redact --exit-code 1

  # ── 7. Compose 端到端冒烟：真正把服务拉起来打请求 ──
  # 单元测试无法覆盖「配置缩进错误导致 Mapper 不绑定」「Flyway 误启用」「healthcheck 打鉴权端点」
  # 这类启动即崩的问题，只有真实启动一次才能拦住。
  smoke-e2e:
    name: Compose End-to-End Smoke (startup gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build runnable jars
        run: |
          (cd 01-log-audit-system && mvn -B package -DskipTests -q)
          (cd 03-log-ai-assistant && mvn -B package -DskipTests -q)

      - name: Start the full stack
        run: docker compose up -d --build

      - name: Wait for AuditVault to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "AuditVault is UP after ${i} polls"
              exit 0
            fi
            sleep 5
          done
          echo "AuditVault did not become healthy in time"
          docker compose logs audit-backend | tail -n 100
          exit 1

      - name: Assert login and list endpoints
        run: |
          CODE=$(curl -s -o /tmp/login.json -w '%{http_code}' \
            -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}')
          cat /tmp/login.json
          test "$CODE" = "200"
          grep -q '"success":true' /tmp/login.json

          curl -sf -c /tmp/cookies.txt -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' > /dev/null
          curl -sf -b /tmp/cookies.txt 'http://localhost:8080/api/logs?page=1&pageSize=3' | grep -q '"total"'

      - name: Assert Nexus AI is reachable
        run: curl -sf http://localhost:8081/ > /dev/null && echo "Nexus AI OK"

      - name: Dump container status on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail 100
