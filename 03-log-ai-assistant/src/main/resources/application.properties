spring.application.name=log-ai-assistant
server.port=8081

# MySQL (共享项目一的数据库)
spring.datasource.url=jdbc:mysql://localhost:3306/log_audit?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.logai.entity
mybatis.configuration.map-underscore-to-camel-case=true

# LLM API 配置 (通过环境变量读取，勿硬编码)
# AI_API_KEY=sk-xxx          ← 在环境变量中设置
# AI_API_URL=https://api.anthropic.com/v1/messages
# AI_MODEL=claude-sonnet-5-20251001
ai.api.url=${AI_API_URL:https://api.anthropic.com/v1/messages}
ai.api.model=${AI_MODEL:claude-sonnet-5-20251001}
ai.api.timeout-seconds=60
