spring.application.name=log-ai-assistant
server.port=8081

# MySQL (共享项目一的数据库)
spring.datasource.url=jdbc:mysql://localhost:3306/log_audit?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:mio123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.logai.entity
mybatis.configuration.map-underscore-to-camel-case=true

# LLM API 配置 (通过环境变量读取，勿硬编码)
# AI_API_KEY=sk-xxx          ← 在环境变量中设置
# AI_API_URL=https://api.deepseek.com/v1/chat/completions
# AI_MODEL=deepseek-chat
ai.api.url=${AI_API_URL:https://api.deepseek.com/v1/chat/completions}
ai.api.model=${AI_MODEL:deepseek-chat}
ai.api.timeout-seconds=60

# JWT（与项目一共享同一密钥，实现单点登录）
app.jwt.secret=${JWT_SECRET:auditvault-demo-secret-key-change-me-in-production-32bytes-min}
app.jwt.expiration-ms=86400000

# Ollama 本地私有化大模型配置 (数据 100% 离线安全私有化)
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434}
ollama.api.model=${OLLAMA_MODEL:deepseek-r1:7b}
ollama.timeout-seconds=60
