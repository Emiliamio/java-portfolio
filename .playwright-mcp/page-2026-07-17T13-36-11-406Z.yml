- generic [active] [ref=f6e1]: "/* 鏁翠釜鍗氬鐨勫瑙� */ html,body,#body-wrap { background: #1a1035 !important; color: #e0d0f0 !important; } /* 鍗＄墖浠� */ #recent-posts>.recent-post-item, #recent-posts .recent-post-item, .recent-post-item, #aside-content .card-widget, .card-widget, .archive .recent-post-item, .post-block,#post { background: #24184a !important; border: 1px solid rgba(255,158,197,0.2) !important; border-radius: 12px !important; } /* 瀵艰埅 */ #nav { background: #0d0820 !important; border-bottom: 1px solid rgba(255,158,197,0.2) !important; } #nav a, #nav a * { color: #ffa5c8 !important; background: transparent !important; } /* 椤佃剼 */ #footer { background: #0f0a20 !important; color: rgba(200,180,220,0.65) !important; } #footer a { color: #ffa5c8 !important; } /* 閾炬帴 */ a, a:visited { color: #ffa5c8 !important; } /* 鏍囬 */ #site-title,.page-title,[class*=article-title] { color: #fff !important; } #site-subtitle { color: #c0b0d8 !important; } h1,h2,h3,h4,h5,h6 { color: #fff !important; } /* 鏂囩珷meta */ .post-meta,.article-meta,.post-meta span,.article-meta span,time,.article-meta-wrap,.article-meta-wrap * { color: #b0a0cc !important; } /* 渚ц竟鏍忔暟鎹� */ .site-data .headline,.site-data .length-num,.author-info-name { color: #fff !important; } /* 澶撮儴 */ #post-info,#post-meta,#page-header { background-color: transparent !important; } /* 婊氬姩鏉� */ ::-webkit-scrollbar { width: 6px } ::-webkit-scrollbar-thumb { background: #ff9ec5; border-radius: 3px } ::-webkit-scrollbar-track { background: #1a1a2e }"